name: groupstudy-prod CD

on:
  push:
    tags:
      - 'deploy-*'
    paths: 'backend/**'

permissions:
  contents: read

env:
  DOCKER_IMAGE: group-study-api
  wd: ./backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Copy application.yml
        working-directory: ${{ env.wd }}
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION }}" > ./src/main/resources/application.yml
          echo "${{ secrets.APPLICATION_PROD }}" > ./src/main/resources/application-prod.yml

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build with Gradle
        working-directory: ${{ env.wd }}
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Build Docker image
        working-directory: ${{ env.wd }}
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .
          docker save ${{ env.DOCKER_IMAGE }}:latest -o docker-image.tar
          # 권한 문제 해결
          chmod 644 docker-image.tar
          ls -la docker-image.tar

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.HOME_SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "backend/docker-image.tar,backend/docker-compose.yml"
          target: "~/apps/group-study"

      - name: Deploy with docker-compose
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HOME_SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # PATH 설정
            export PATH=/opt/homebrew/bin:$PATH            
            
            cd ~/apps/group-study/backend
            
            # Docker 이미지 로드
            docker load -i docker-image.tar
            
            # docker-compose로 배포
            docker compose down
            docker compose up -d
            
            # 헬스체크
            sleep 15
            if docker ps | grep -q group-study; then
              echo "✅ 배포 성공"
              rm docker-image.tar
              docker image prune -f
            else
              echo "❌ 배포 실패"
              docker compose logs
              exit 1
            fi