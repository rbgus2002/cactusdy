name: groupstudy-prod CD

on:
  push:
    tags:
      - 'deploy-*'
    paths: 'backend/**'

permissions:
  contents: read

env:
  DOCKER_IMAGE: group-study-api
  wd: ./backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Copy application.yml
        working-directory: ${{ env.wd }}
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION }}" > ./src/main/resources/application.yml
          echo "${{ secrets.APPLICATION_PROD }}" > ./src/main/resources/application-prod.yml
          
          # FCM 키 파일 생성
          echo "${{ secrets.FCM_KEY_BASE64 }}" | base64 -d > ./src/main/resources/studygroup-fcm.json

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build with Gradle
        working-directory: ${{ env.wd }}
        run: |
          chmod +x gradlew
          ./gradlew build -x test


      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.HOME_SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "backend/build/libs/*.jar,backend/Dockerfile,backend/docker-compose.yml,backend/src/main/resources/studygroup-fcm.json"
          target: "~/Desktop/guegue/group-study"

      - name: Build and Deploy on Server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HOME_SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            export PATH=/opt/homebrew/bin:$PATH
            
            cd ~/Desktop/guegue/group-study/backend
            
            # 1. 기존 컨테이너 중지 및 제거
            echo "🛑 기존 컨테이너 중지..."
            docker compose down
            
            # 2. 기존 이미지 제거 (캐시 문제 해결)
            echo "🗑️ 기존 이미지 제거..."
            docker rmi group-study-api:latest || true
            
            # 3. 기존 JAR 파일 제거 (중복 방지)
            echo "🧹 기존 파일 정리..."
            rm -rf build/libs/*.jar
            
            # 4. 새로운 이미지 빌드 (--no-cache 옵션 추가)
            echo "🔨 Docker 이미지 빌드 시작..."
            docker build --no-cache -t group-study-api:latest .
            
            # 5. 컨테이너 시작
            echo "🚀 컨테이너 시작..."
            docker compose up -d
            
            # 6. 헬스체크
            sleep 15
            if docker ps | grep -q group-study; then
              echo "✅ 배포 성공"
            
              # 배포 완료 후 확인
              echo "📋 실행 중인 컨테이너 정보:"
              docker ps | grep group-study
            
              echo "🏷️ 이미지 정보:"
              docker images | grep group-study-api
            
              # 정리 작업
              rm -f build/libs/*.jar
              rm -f src/main/resources/studygroup-fcm.json
              docker image prune -f
            else
              echo "❌ 배포 실패"
              docker compose logs
              exit 1
            fi