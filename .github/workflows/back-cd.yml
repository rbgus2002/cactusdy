name: groupstudy-prod CD

on:
  push:
    tags:
      - 'deploy-*'
    paths: 'backend/**'

permissions:
  contents: read

env:
  DOCKER_IMAGE: group-study-api
  wd: ./backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Copy application.yml
        working-directory: ${{ env.wd }}
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION }}" > ./src/main/resources/application.yml
          echo "${{ secrets.APPLICATION_PROD }}" > ./src/main/resources/application-prod.yml
          
          # FCM 키 파일 생성
          echo "${{ secrets.FCM_KEY_BASE64 }}" | base64 -d > ./src/main/resources/studygroup-fcm.json

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build with Gradle
        working-directory: ${{ env.wd }}
        run: |
          chmod +x gradlew
          ./gradlew build -x test


      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.HOME_SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "backend/build/libs/*.jar,backend/Dockerfile,backend/docker-compose.yml,backend/src/main/resources/studygroup-fcm.json"
          target: "~/Desktop/guegue/group-study"

      - name: Build and Deploy on Server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HOME_SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            export PATH=/opt/homebrew/bin:$PATH
            
            docker stop group-study || true
            docker rm group-study || true
            
            cd ~/Desktop/guegue/group-study/backend  # backend 추가
            
            # Docker 빌드 전
            echo "🔨 Docker 이미지 빌드 시작..."
            docker build -t group-study-api:latest .
            
            echo "🚀 컨테이너 시작..."
            docker compose up -d            
            
            sleep 15
            if docker ps | grep -q group-study && curl -f http://localhost:8080/health 2>/dev/null; then
              echo "✅ 배포 성공"
              rm -f build/libs/*.jar
              rm -f src/main/resources/studygroup-fcm.json
              docker image prune -f
            else
              echo "❌ 배포 실패"
              docker compose logs
              exit 1
            fi