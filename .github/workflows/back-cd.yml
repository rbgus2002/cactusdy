name: groupstudy-prod CD

on:
  push:
    tags:
      - 'deploy-*'
    paths: 'backend/**'

permissions:
  contents: read

env:
  DOCKER_IMAGE: group-study-api
  wd: ./backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Copy application.yml
        working-directory: ${{ env.wd }}
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION }}" > ./src/main/resources/application.yml
          echo "${{ secrets.APPLICATION_PROD }}" > ./src/main/resources/application-prod.yml
          echo "${{ secrets.FCM_KEY_BASE64 }}" | base64 -d > ./src/main/resources/studygroup-fcm.json

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build with Gradle
        working-directory: ${{ env.wd }}
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.HOME_SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "backend/build/libs/*.jar,backend/Dockerfile,backend/docker-compose.yml,backend/nginx/default.conf,backend/src/main/resources/studygroup-fcm.json"
          target: "~/Desktop/guegue/group-study"

      - name: Build and Deploy on Server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HOME_SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            DOCKER_BIN=/Applications/Docker.app/Contents/Resources/bin
            export PATH="$DOCKER_BIN:$PATH"
            DOCKER=$DOCKER_BIN/docker

            cd ~/Desktop/guegue/group-study/backend

            $DOCKER stop group-study || true
            $DOCKER rm group-study || true

            echo "🔨 Docker 이미지 빌드 시작..."
            $DOCKER build --no-cache -t group-study-api:latest .

            echo "🚀 컨테이너 시작..."
            $DOCKER compose up -d

            sleep 15

            if $DOCKER ps | grep -q group-study; then
              echo "✅ 배포 성공"
              rm -f src/main/resources/studygroup-fcm.json
              $DOCKER image prune -f
            else
              echo "❌ 배포 실패"
              $DOCKER compose logs
              exit 1
            fi
