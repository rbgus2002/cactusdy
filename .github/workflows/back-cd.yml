name: groupstudy-prod CD

on:
  push:
    tags:
      - 'deploy-*'
    paths: 'backend/**'

permissions:
  contents: read

env:
  DOCKER_IMAGE: group-study-api
  wd: ./backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Copy application.yml
        working-directory: ${{ env.wd }}
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION }}" > ./src/main/resources/application.yml
          echo "${{ secrets.APPLICATION_PROD }}" > ./src/main/resources/application-prod.yml
          echo "${{ secrets.FCM_KEY_BASE64 }}" | base64 -d > ./src/main/resources/studygroup-fcm.json

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build with Gradle
        working-directory: ${{ env.wd }}
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.HOME_SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "backend/build/libs/*.jar,backend/Dockerfile,backend/docker-compose.yml,backend/nginx/default.conf,backend/src/main/resources/studygroup-fcm.json"
          target: "~/Desktop/guegue/group-study"

      - name: Build and Deploy on Server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HOME_SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            DOCKER_BIN=/Applications/Docker.app/Contents/Resources/bin
            export PATH="$DOCKER_BIN:$PATH"

            if [ -x "$DOCKER_BIN/docker" ]; then
              DOCKER=$DOCKER_BIN/docker
            else
              DOCKER=$(command -v docker || true)
            fi

            if [ -z "${DOCKER:-}" ]; then
              echo "❌ docker command not found."
              exit 1
            fi

            export DOCKER_CONFIG=/tmp/docker-ci-config
            mkdir -p "$DOCKER_CONFIG"
            cat > "$DOCKER_CONFIG/config.json" <<'DOCKERCONF'
            {
              "auths": {}
            }
            DOCKERCONF

            COMPOSE_VERSION=2.27.1
            COMPOSE_FALLBACK_IMAGE=docker/compose:$COMPOSE_VERSION
            COMPOSE_DOWNLOAD_BINARY=/tmp/docker-compose
            APP_DIR=~/Desktop/guegue/group-study/backend
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if "$DOCKER" compose version >/dev/null 2>&1; then
              COMPOSE=("$DOCKER" "compose")
              echo "🔧 using plugin: docker compose"
            elif [ -x "$DOCKER_BIN/docker-compose" ]; then
              COMPOSE=("$DOCKER_BIN/docker-compose")
              echo "🔧 using docker-compose at: $DOCKER_BIN/docker-compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE=(docker-compose)
              echo "🔧 using docker-compose from PATH"
            elif "$DOCKER" run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$APP_DIR:$APP_DIR" \
              -w "$APP_DIR" \
              "$COMPOSE_FALLBACK_IMAGE" version >/dev/null 2>&1; then
              COMPOSE=("$DOCKER" run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                -v "$APP_DIR:$APP_DIR" \
                -w "$APP_DIR" \
                "$COMPOSE_FALLBACK_IMAGE")
              echo "⚠️ using docker/compose 컨테이너 fallback"
            elif command -v curl >/dev/null 2>&1 || command -v wget >/dev/null 2>&1; then
              echo "⚠️ local docker-compose가 없어 정적 바이너리로 설치합니다."
              OS_NAME=$(uname -s | tr '[:upper:]' '[:lower:]')
              ARCH_NAME=$(uname -m)
              case "$ARCH_NAME" in
                x86_64|amd64)
                  COMPOSE_ARCH=x86_64
                  ;;
                aarch64|arm64)
                  COMPOSE_ARCH=aarch64
                  ;;
                *)
                  echo "❌ unsupported architecture: $ARCH_NAME"
                  exit 1
                  ;;
              esac

              if [ "$OS_NAME" = "darwin" ]; then
                COMPOSE_OS=darwin
              else
                COMPOSE_OS=linux
              fi

              COMPOSE_DOWNLOAD_URL="https://github.com/docker/compose/releases/download/v$COMPOSE_VERSION/docker-compose-$COMPOSE_OS-$COMPOSE_ARCH"
              if command -v curl >/dev/null 2>&1; then
                curl -fsSL "$COMPOSE_DOWNLOAD_URL" -o "$COMPOSE_DOWNLOAD_BINARY"
              else
                wget -qO "$COMPOSE_DOWNLOAD_BINARY" "$COMPOSE_DOWNLOAD_URL"
              fi

              if [ ! -x "$COMPOSE_DOWNLOAD_BINARY" ]; then
                chmod +x "$COMPOSE_DOWNLOAD_BINARY"
              fi
              COMPOSE=("$COMPOSE_DOWNLOAD_BINARY")
              echo "🔧 using downloaded compose binary: $COMPOSE_DOWNLOAD_BINARY"
            else
              echo "❌ docker compose 또는 docker-compose를 찾을 수 없습니다."
              exit 1
            fi
            echo "🔧 using compose command: ${COMPOSE[*]}"
            IMAGE_NAME=group-study-api:latest

            $DOCKER stop group-study || true
            $DOCKER rm group-study || true
            "${COMPOSE[@]}" down || true

            echo "🔨 Docker 이미지 빌드 시작..."
            $DOCKER build --no-cache -t "$IMAGE_NAME" .

            echo "🚀 컨테이너 시작..."
            "${COMPOSE[@]}" up -d

            sleep 15

            if $DOCKER ps --filter "name=^/group-study$" --format '{{.Names}}' | grep -q '^group-study$'; then
              echo "✅ 배포 성공"
              rm -f src/main/resources/studygroup-fcm.json
              $DOCKER image prune -f
            else
              echo "❌ 배포 실패"
              "${COMPOSE[@]}" logs
              exit 1
            fi
