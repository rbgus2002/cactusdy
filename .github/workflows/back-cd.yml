name: groupstudy-prod CD

on:
  push:
    tags:
      - 'deploy-*'
    paths: 'backend/**'

permissions:
  contents: read

env:
  DOCKER_IMAGE: group-study-api
  wd: ./backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Copy application.yml
        working-directory: ${{ env.wd }}
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION }}" > ./src/main/resources/application.yml
          echo "${{ secrets.APPLICATION_PROD }}" > ./src/main/resources/application-prod.yml
          echo "${{ secrets.FCM_KEY_BASE64 }}" | base64 -d > ./src/main/resources/studygroup-fcm.json

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build with Gradle
        working-directory: ${{ env.wd }}
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.HOME_SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "backend/build/libs/*.jar,backend/Dockerfile,backend/docker-compose.yml,backend/nginx/default.conf,backend/src/main/resources/studygroup-fcm.json"
          target: "~/Desktop/guegue/group-study"

      - name: Build and Deploy on Server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HOME_SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
            DOCKER_CANDIDATES=(
              "$(command -v docker || true)"
              /usr/local/bin/docker
              /opt/homebrew/bin/docker
              /usr/bin/docker
              /bin/docker
              /Applications/Docker.app/Contents/Resources/bin/docker
            )
            DOCKER=""

            for candidate in "${DOCKER_CANDIDATES[@]}"; do
              if [ -n "$candidate" ] && [ -x "$candidate" ]; then
                DOCKER="$candidate"
                break
              fi
            done

            if [ -z "$DOCKER" ]; then
              echo "❌ docker command not found."
              echo "PATH=$PATH"
              which -a docker || true
              for candidate in "${DOCKER_CANDIDATES[@]}"; do
                [ -n "$candidate" ] && echo "checked: $candidate"
                [ -x "$candidate" ] && echo "  -> executable"
              done
              exit 1
            fi

            echo "✅ docker: $DOCKER"
            "$DOCKER" version

            export DOCKER_CONFIG=/tmp/docker-ci-config
            mkdir -p "$DOCKER_CONFIG"
            cat > "$DOCKER_CONFIG/config.json" <<'DOCKERCONF'
            {
              "auths": {},
              "credsStore": ""
            }
            DOCKERCONF

            APP_DIR=~/Desktop/guegue/group-study/backend
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if ! "$DOCKER" compose version >/dev/null 2>&1; then
              if [ -x /Applications/Docker.app/Contents/Resources/cli-plugins/docker-compose ]; then
                mkdir -p "$HOME/.docker/cli-plugins"
                ln -sf /Applications/Docker.app/Contents/Resources/cli-plugins/docker-compose "$HOME/.docker/cli-plugins/docker-compose"
              fi
            fi

            if "$DOCKER" compose version >/dev/null 2>&1; then
              COMPOSE=("$DOCKER" "compose")
              echo "🔧 using docker compose"
            else
              echo "❌ docker compose를 찾을 수 없습니다."
              echo "PATH=$PATH"
              ls -l "$HOME/.docker/cli-plugins/docker-compose" /Applications/Docker.app/Contents/Resources/cli-plugins/docker-compose 2>/dev/null || true
              ls -l "$HOME/.docker/cli-plugins/docker-compose" /Applications/Docker.app/Contents/Resources/cli-plugins/docker-compose 2>/dev/null || true
              exit 1
            fi

            echo "🔧 using compose command: ${COMPOSE[*]}"
            IMAGE_NAME=group-study-api:latest

            "$DOCKER" stop group-study || true
            "$DOCKER" rm group-study || true
            "${COMPOSE[@]}" down || true

            echo "🔨 Docker 이미지 빌드 시작..."
            "$DOCKER" build --no-cache -t "$IMAGE_NAME" .

            echo "🚀 컨테이너 시작..."
            "${COMPOSE[@]}" up -d

            sleep 15

            if "$DOCKER" ps --filter "name=^/group-study$" --format '{{.Names}}' | grep -q '^group-study$'; then
              echo "✅ 배포 성공"
              rm -f src/main/resources/studygroup-fcm.json
              "$DOCKER" image prune -f
            else
              echo "❌ 배포 실패"
              "${COMPOSE[@]}" logs
              exit 1
            fi
