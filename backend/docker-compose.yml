version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: group-study-mysql
    networks:
      - traefik-net
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123!
      MYSQL_DATABASE: groupstudy_new
      MYSQL_USER: admin
      MYSQL_PASSWORD: qwe50584621
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: group-study-redis
    networks:
      - traefik-net
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  group-study:
    image: group-study-api:latest
    container_name: group-study
    networks:
      - traefik-net
    ports:
      - "8080:8080"  # 로컬 접근을 위한 포트 매핑 추가
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.group-study.rule=Host(`cactusdy.guegue.dev`) && PathPrefix(`/api`)"
      - "traefik.http.routers.group-study.entrypoints=websecure"
      - "traefik.http.routers.group-study.tls.certresolver=le"
      - "traefik.http.services.group-study.loadbalancer.server.port=8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/groupstudy_new?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=qwe50584621
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - LOG_PATH=/app/logs
      - LOG_FILE=groupstudy
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - /Users/choegyuhyeon/Desktop/guegue/data/uploads:/data/uploads:rw

  nginx-static:
    image: nginx:1.25-alpine
    container_name: nginx-static
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx-static.rule=Host(`cactusdy.guegue.dev`) && PathPrefix(`/images`)"
      - "traefik.http.routers.nginx-static.entrypoints=websecure"
      - "traefik.http.routers.nginx-static.tls.certresolver=le"
      - "traefik.http.services.nginx-static.loadbalancer.server.port=80"
    volumes:
      - /Users/choegyuhyeon/Desktop/guegue/data/uploads:/data/uploads:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  traefik-net:
    external: true
